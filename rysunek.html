<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Rysunek techniczny | ProfilMat</title>
<style>
@page{size:A4 landscape;margin:8mm}
*{box-sizing:border-box}
body{margin:0;background:#eceeef;color:#16191c;font:14px/1.4 "Segoe UI",Roboto,Arial,sans-serif}
.bar{position:sticky;top:0;background:#16191c;color:#fff;display:flex;gap:12px;align-items:center;padding:10px 16px;z-index:5}
.bar b{margin-right:auto;font-family:Georgia,serif;font-size:1.1rem}
.bar button{background:#ff6a13;color:#111;border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.sheet{background:#fff;max-width:1120px;margin:16px auto;padding:14px;border:1px solid #c9ced3;page-break-after:always;break-after:page}
.sheet:last-child{page-break-after:auto;break-after:auto}
svg{width:100%;height:auto;display:block}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:8px}
td,th{border:1px solid #9aa1a8;padding:3px 8px;text-align:left;vertical-align:top}
th{background:#eef0f2;width:22%}
h2{margin:4px 0 6px;font:600 1.15rem Georgia,serif}
.msg{max-width:700px;margin:40px auto;padding:20px;background:#fff;border:1px solid #c9ced3;border-radius:8px}
@media print{body{background:#fff}.bar{display:none}.sheet{border:0;margin:0;padding:0;max-width:none}}
</style></head><body>
<div class="bar"><b>ProfilMat · rysunek techniczny</b><button onclick="print()">Drukuj / zapisz jako PDF</button></div>
<div id="out"></div>
<script>
(function(){
const out=document.getElementById("out"),fm=v=>String(Math.round(v*10)/10).replace(".",",");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
function cords(S){const m=Math.min(10,S*.2),span=Math.max(0,S-2*m),k=Math.max(2,Math.ceil(span/40-1e-9)+1);return Array.from({length:k},(_,i)=>m+span*i/(k-1))}
const area=p=>{let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s)/2};
function dec(){try{const m=/[#&]d=([^&]+)/.exec(location.hash);if(!m)return null;let b=m[1].replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";const j=JSON.parse(decodeURIComponent(escape(atob(b))));return Array.isArray(j)?j:[j]}catch(e){return null}}
const D=dec();
if(!D||!D.length){out.innerHTML='<div class="msg"><b>Brak danych rysunku.</b><br>Otwórz link z wiadomości o zamówieniu albo z koszyka w sklepie.</div>'}
else D.forEach((d,i)=>out.append(sheet(d,i+1,D.length)));
function sheet(d,no,all){
 const W=d.W,H=d.H,cuts=d.cuts||[],outline=d.o,base=outline||[[0,0],[W,0],[W,H],[0,H]];
 const e=d.e||"L",horiz=e==="L"||e==="R";
 const VW=1100,VH=640,ox=90,oy=70,s=Math.min((VW-ox-150)/W,(VH-oy-130)/H),X=x=>ox+x*s,Y=y=>oy+y*s;
 let g=`<defs><pattern id="hp${no}" width="${horiz?5:6}" height="${horiz?6:5}" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#f4f5f6"/><${horiz?'rect x="0" y="0" width="1.2" height="9"':'rect x="0" y="0" width="9" height="1.2"'} fill="#9aa1a8"/></pattern><marker id="ar${no}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#111"/></marker></defs>`;
 const path=p=>"M"+p.map(q=>X(q[0]).toFixed(1)+" "+Y(q[1]).toFixed(1)).join("L")+"Z";
 // próg gumowy / aluminiowy (rysowany poza planem)
 let rampTxt="brak";
 if(d.rk&&d.k!=="shape"){const bar=4*s;let sd;
  if(d.k==="mat")sd=d.rk===4?["T","B","L","R"]:["T","B"];
  else{const par=horiz?["L","R"]:["T","B"];sd=d.rk===4?["T","B","L","R"]:(d.rk===2?par:[par[0]])}
  const rr=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#c9ced3" stroke="#555" stroke-width="1" stroke-dasharray="4 3"/>`;
  sd.forEach(q=>{if(q==="T")g+=rr(X(0),Y(0)-bar,W*s,bar);if(q==="B")g+=rr(X(0),Y(H),W*s,bar);if(q==="L")g+=rr(X(0)-bar,Y(0),bar,H*s);if(q==="R")g+=rr(X(W),Y(0),bar,H*s)});
  rampTxt=(d.k==="mat"?"gumowe":"aluminiowe")+", "+(d.rk===4?"na 4 bokach":(d.rk===1?"na 1 boku":"na 2 bokach"))+" (na rysunku szare, przerywane)";
 }
 // plan
 const fill=d.k==="mat"?"#2a2d30":`url(#hp${no})`;
 g+=`<path d="${path(base)}" fill="${fill}" stroke="#111" stroke-width="2.2"/>`;
 if(d.fr&&d.k!=="mat")g+=`<path d="${path(base)}" fill="none" stroke="#1b2340" stroke-width="${Math.max(6,1.2*s)}" stroke-linejoin="miter" opacity=".9"/><path d="${path(base)}" fill="none" stroke="#2dd4bf" stroke-width="1"/>`;
 if(d.k!=="mat"&&d.S){ // linki
  const len=horiz?W:H,wid=horiz?H:W,cs=d.k==="shape"?cords(wid):cords(d.S);
  cs.forEach(v=>{const a=horiz?[X(0),Y(v)]:[X(v),Y(0)],b=horiz?[X(W),Y(v)]:[X(v),Y(H)];g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#2563eb" stroke-width="1" stroke-dasharray="7 4" opacity=".75"/>`});
 }
 cuts.forEach((c,i)=>{g+=`<path d="${path(c)}" fill="#fff" stroke="#c2410c" stroke-width="2"/>`});
 // wymiary pomocnicze
 const dimH=(x1,x2,y,txt,off)=>`<line x1="${X(x1)}" y1="${y}" x2="${X(x2)}" y2="${y}" stroke="#111" stroke-width="1.1" marker-start="url(#ar${no})" marker-end="url(#ar${no})"/><text x="${(X(x1)+X(x2))/2}" y="${y+off}" text-anchor="middle" font-size="13" font-weight="700" fill="#111" paint-order="stroke" stroke="#fff" stroke-width="4">${txt}</text>`;
 const dimV=(y1,y2,x,txt,off)=>`<line x1="${x}" y1="${Y(y1)}" x2="${x}" y2="${Y(y2)}" stroke="#111" stroke-width="1.1" marker-start="url(#ar${no})" marker-end="url(#ar${no})"/><text x="${x+off}" y="${(Y(y1)+Y(y2))/2}" text-anchor="middle" font-size="13" font-weight="700" fill="#111" transform="rotate(-90 ${x+off} ${(Y(y1)+Y(y2))/2})" paint-order="stroke" stroke="#fff" stroke-width="4">${txt}</text>`;
 const ext=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#555" stroke-width=".8" stroke-dasharray="3 3"/>`;
 const xs=base.map(p=>p[0]),ys=base.map(p=>p[1]),bx2=Math.max(...xs),by2=Math.max(...ys);
 const lenTxt=fm(horiz?W:H),widTxt=fm(horiz?H:W);
 g+=ext(X(0),Y(by2),X(0),Y(by2)+44)+ext(X(bx2),Y(by2),X(bx2),Y(by2)+44)+dimH(0,bx2,Y(by2)+36,fm(bx2)+" cm",-8);
 g+=ext(X(bx2),Y(0),X(bx2)+44,Y(0))+ext(X(bx2),Y(by2),X(bx2)+44,Y(by2))+dimV(0,by2,X(bx2)+36,fm(by2)+" cm",-8);
 // wymiary krawędzi
 const edges=(p,col,lab)=>{for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(l<1||l*s<26)continue;const mx=X((a[0]+b[0])/2),my=Y((a[1]+b[1])/2);
  g+=`<text x="${mx}" y="${my+4}" text-anchor="middle" font-size="12" font-weight="700" fill="${col}" paint-order="stroke" stroke="#fff" stroke-width="4">${fm(l)}</text>`}};
 cuts.forEach(c=>edges(c,"#c2410c"));if(outline)edges(outline,"#111");
 // położenie wcięć od krawędzi (dla prostokątnych) i numery
 cuts.forEach((c,i)=>{const cx=c.map(p=>p[0]),cy=c.map(p=>p[1]),x1=Math.min(...cx),y1=Math.min(...cy),x2=Math.max(...cx),y2=Math.max(...cy);
  g+=`<g><circle cx="${X((x1+x2)/2)}" cy="${Y((y1+y2)/2)}" r="11" fill="#c2410c"/><text x="${X((x1+x2)/2)}" y="${Y((y1+y2)/2)+4.5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${i+1}</text></g>`});
 if(d.k!=="mat"){
 cuts.forEach(c=>{const cx=c.map(p=>p[0]),cy=c.map(p=>p[1]),x1=Math.min(...cx),y1=Math.min(...cy),x2=Math.max(...cx),y2=Math.max(...cy);if(!(c.length===4&&new Set(cx).size===2&&new Set(cy).size===2))return;
  const ln=(a,b,c2,d2)=>`<line x1="${a}" y1="${b}" x2="${c2}" y2="${d2}" stroke="#2563eb" stroke-width="1" marker-start="url(#ar${no})" marker-end="url(#ar${no})"/>`,tx=(x,y,t,r)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="11" fill="#1d4ed8" paint-order="stroke" stroke="#fff" stroke-width="3.5"${r?` transform="rotate(-90 ${x} ${y})"`:""}>${t}</text>`;
  if(x1>0){const y=Y(y2)+14;g+=ln(X(0),y,X(x1),y)+tx((X(0)+X(x1))/2,y-4,fm(x1))}
  if(y1>0){const x=X(x2)+14;g+=ln(x,Y(0),x,Y(y1))+tx(x-4,(Y(0)+Y(y1))/2,fm(y1),1)}
  if(bx2-x2>0&&x2<bx2){const y=Y(y1)-8;g+=ln(X(x2),y,X(bx2),y)+tx((X(x2)+X(bx2))/2,y-4,fm(bx2-x2))}
  if(by2-y2>0){const x=X(x1)-14;g+=ln(x,Y(y2),x,Y(by2))+tx(x-4,(Y(y2)+Y(by2))/2,fm(by2-y2),1)}});
 // oś wejścia
 const dd={L:[1,0],R:[-1,0],T:[0,1],B:[0,-1]}[e],mid={L:[0,H/2],R:[W,H/2],T:[W/2,0],B:[W/2,H]}[e];
 const mx=X(mid[0]),my=Y(mid[1]),ln=Math.min(70,(horiz?W:H)*s*.25),tip=[mx+dd[0]*6,my+dd[1]*6],tail=[tip[0]+dd[0]*ln,tip[1]+dd[1]*ln];
 g+=(horiz?`<line x1="${mx}" y1="${Y(0)}" x2="${mx}" y2="${Y(H)}"`:`<line x1="${X(0)}" y1="${my}" x2="${X(W)}" y2="${my}"`)+` stroke="#15803d" stroke-width="5"/>`;
 g+=`<line x1="${tail[0]}" y1="${tail[1]}" x2="${tip[0]}" y2="${tip[1]}" stroke="#15803d" stroke-width="3.2" marker-end="url(#ar${no}g)"/>`;
 g=g.replace(`<marker id="ar${no}"`,`<marker id="ar${no}g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L10 5L0 9z" fill="#15803d"/></marker><marker id="ar${no}"`);
 const lx=tail[0]+dd[0]*34,ly=tail[1]+dd[1]*16;g+=`<rect x="${lx-34}" y="${ly-10}" width="68" height="20" fill="#15803d"/><text x="${lx}" y="${ly+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">WEJŚCIE</text>`;
 }
 // tabela
 const tot=(area(base)-cuts.reduce((a,c)=>a+area(c),0))/10000;
 const rows=[["Pozycja",esc(d.n||"")],["Wymiar całkowity (obrys)",fm(bx2)+" × "+fm(by2)+" cm (plan z góry, początek układu w lewym górnym rogu)"]];
 if(d.k!=="mat"){rows.push(["Profil",esc(d.p||"")+" mm"]);rows.push(["Wykonanie",esc(d.wn||"")+(d.c?", kolor "+esc(d.cn||d.c)+(d.c2&&d.c2!==d.c?" / "+esc(d.c2n||d.c2):""):"")]);
  const cl=d.k==="shape"?cords(horiz?H:W).length:cords(d.S).length;
  if(d.np)rows.push(["Liczba profili",String(d.np)]);rows.push(["Linki",cl+" szt., rozstaw maks. 40 cm (linie niebieskie przerywane)"]);
  rows.push(["Profile",horiz?"równolegle do wejścia, ułożone wzdłuż kierunku wejścia (strzałka)":"równolegle do wejścia, ułożone wzdłuż kierunku wejścia (strzałka)"])}
 if(d.fr&&d.k!=="mat")rows.push(["Ramka","dookoła całej wycieraczki, granatowy profil C wys. 13,5 mm (na rysunku ciemny obrys)"]);
 rows.push(["Progi najazdowe",d.k==="shape"?"do ustalenia po kontakcie":rampTxt]);
 rows.push(["Pole",fm(Math.round(tot*100)/100)+" m²"]);
 if(outline)rows.push(["Własny obrys, punkty (x, y) w cm",outline.map((p,i)=>(i+1)+": ("+p[0]+", "+p[1]+")").join("; ")]);
 cuts.forEach((c,i)=>{const cx=c.map(p=>p[0]),cy=c.map(p=>p[1]),x1=Math.min(...cx),y1=Math.min(...cy),x2=Math.max(...cx),y2=Math.max(...cy),rect=c.length===4&&new Set(cx).size===2&&new Set(cy).size===2;
  rows.push(["Wcięcie "+(i+1),rect?fm(x2-x1)+" × "+fm(y2-y1)+" cm. Od lewej krawędzi: "+fm(x1)+" cm, od górnej: "+fm(y1)+" cm, od prawej: "+fm(bx2-x2)+" cm, od dolnej: "+fm(by2-y2)+" cm":"wielokąt, pole "+fm(Math.round(area(c)/100)/100)+" m², punkty (x, y) w cm: "+c.map((p,k)=>(k+1)+": ("+p[0]+", "+p[1]+")").join("; ")])});
 rows.push(["Uwaga","Rysunek poglądowy wygenerowany ze sklepu. Wymiary podano w centymetrach. Ostateczne wymiary potwierdzimy z klientem."]);
 const el=document.createElement("div");el.className="sheet";
 el.innerHTML=`<h2>Rysunek techniczny ${all>1?no+" z "+all:""} · ${esc(d.n||"")}</h2><svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Rysunek techniczny z wymiarami">${g}</svg><table>${rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table><p style="font-size:11px;color:#5d656c;margin:6px 0 0">Wygenerowano: ${new Date().toLocaleDateString("pl-PL")} · ProfilMat</p>`;
 return el}
})();
</script></body></html>
